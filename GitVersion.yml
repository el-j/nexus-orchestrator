assembly-versioning-scheme: MajorMinorPatch
tag-prefix: '[vV]?'
next-version: 0.10.0

branches:
  main:
    regex: ^main$
    label: ''
    increment: Patch
    source-branches:
      - develop
      - feature
      - hotfix
      - release
      - copilot
      - alpha
      - beta

  develop:
    regex: ^develop$
    label: beta
    increment: None
    source-branches:
      - main
      - feature
      - hotfix

  alpha:
    regex: ^alpha[/-]
    label: alpha
    increment: Minor
    source-branches:
      - main

  beta:
    regex: ^beta[/-]
    label: beta
    increment: Minor
    source-branches:
      - main
      - alpha

  feature:
    regex: ^feature[/-]
    label: alpha
    increment: Minor
    source-branches:
      - main

  hotfix:
    regex: ^hotfix[/-]
    label: ''
    increment: Patch
    source-branches:
      - main

  release:
    regex: ^release[/-]
    label: rc
    increment: None
    source-branches:
      - main
      - feature
      - hotfix
      - beta

  copilot:
    regex: ^copilot[/-]
    label: alpha
    increment: Patch
    source-branches:
      - main
