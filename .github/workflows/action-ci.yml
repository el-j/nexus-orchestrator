name: Action CI

on:
  push:
    branches: [main]
    paths:
      - 'action.yml'
      - 'github-action/**'
      - '!github-action/dist/**'
  pull_request:
    paths:
      - 'action.yml'
      - 'github-action/**'
      - '!github-action/dist/**'

permissions:
  contents: read

concurrency:
  group: action-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: github-action

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: github-action/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (if configured)
        # ESLint is not yet configured as a dev dependency; this step runs the
        # lint script if present and is a no-op otherwise. When eslint is added
        # to package.json, add a "lint" script and this step will start enforcing it.
        run: npm run lint --if-present

      - name: Unit tests with coverage gate
        run: npm run test:coverage

  build-check:
    name: Verify dist is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: github-action

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: github-action/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist
        run: npm run build

      - name: Check dist is unchanged
        # `git status` (not `git diff`) so an untracked or missing bundle also fails:
        # action.yml runs github-action/dist/index.js, so it must be committed.
        run: |
          if [ -n "$(git status --porcelain -- dist/index.js dist/licenses.txt)" ] || ! git ls-files --error-unmatch dist/index.js >/dev/null 2>&1; then
            echo "::error::github-action/dist is missing or out of date."
            echo "Run 'cd github-action && npm ci && npm run build' and commit dist/index.js and dist/licenses.txt."
            git status --short -- dist
            exit 1
          fi
          echo "dist/index.js is committed and up to date ✓"
