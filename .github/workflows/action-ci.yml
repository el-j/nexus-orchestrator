name: Action CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'action.yml'
      - 'github-action/**'
      - '!github-action/dist/**'
      - 'frontend/e2e/support/**'
  pull_request:
    paths:
      - 'action.yml'
      - 'github-action/**'
      - '!github-action/dist/**'
      - 'frontend/e2e/support/**'

permissions:
  contents: read

concurrency:
  group: action-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: github-action

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: github-action/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (if configured)
        # ESLint is not yet configured as a dev dependency; this step runs the
        # lint script if present and is a no-op otherwise. When eslint is added
        # to package.json, add a "lint" script and this step will start enforcing it.
        run: npm run lint --if-present

      - name: Exported declarations are documented
        run: npm run check:docs

      - name: Unit tests with coverage gate
        run: npm run test:coverage

  build-check:
    name: Verify dist is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: github-action

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: github-action/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Rebuild dist
        run: npm run build

      - name: Check dist is unchanged
        # `git status` (not `git diff`) so an untracked or missing bundle also fails:
        # action.yml runs github-action/dist/index.js, so it must be committed.
        run: |
          if [ -n "$(git status --porcelain -- dist/index.js dist/licenses.txt)" ] || ! git ls-files --error-unmatch dist/index.js >/dev/null 2>&1; then
            echo "::error::github-action/dist is missing or out of date."
            echo "Run 'cd github-action && npm ci && npm run build' and commit dist/index.js and dist/licenses.txt."
            git status --short -- dist
            exit 1
          fi
          echo "dist/index.js is committed and up to date ✓"

  e2e:
    name: Action E2E (real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Ensure embedded frontend path exists
        run: |
          mkdir -p build/frontend build/bin
          test -f build/frontend/.gitkeep || touch build/frontend/.gitkeep

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build the daemon
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: '-DSQLITE_ENABLE_FTS5'
          CGO_LDFLAGS: '-lm'
        run: go build -o build/bin/nexus-daemon-e2e ./cmd/nexus-daemon

      # A real daemon on the default ports plus a fake Ollama, the same stack the
      # Playwright real-daemon project uses.
      - name: Start the daemon with a fake model
        env:
          NEXUS_DAEMON_BIN: ${{ github.workspace }}/build/bin/nexus-daemon-e2e
        run: |
          node frontend/e2e/support/stack.mjs > stack.log 2>&1 &
          curl -sf --retry 40 --retry-delay 1 --retry-connrefused http://127.0.0.1:63987/api/health

      - name: Create the project the task will write into
        run: mkdir -p "$RUNNER_TEMP/project"

      - name: Run the action against it
        id: nexus
        uses: ./
        with:
          start_daemon: 'false'
          daemon_url: http://127.0.0.1:63987
          project_path: ${{ runner.temp }}/project
          target_file: from_action.go
          instruction: 'write FUNC_FromAction'
          timeout_seconds: '90'

      - name: Check what the action reported and wrote
        run: |
          test "${{ steps.nexus.outputs.status }}" = "COMPLETED"
          test -n "${{ steps.nexus.outputs.task_id }}"
          grep -q 'func FromAction' "$RUNNER_TEMP/project/from_action.go"

      - name: Show the daemon log on failure
        if: failure()
        run: cat stack.log
