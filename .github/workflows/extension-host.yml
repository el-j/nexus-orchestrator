name: Extension Host Tests

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "vscode-extension/**"
      - "internal/**"
      - "cmd/nexus-daemon/**"
      - ".github/workflows/extension-host.yml"
  pull_request:
    branches:
      - main
      - develop
    paths:
      - "vscode-extension/**"
      - "internal/**"
      - "cmd/nexus-daemon/**"
      - ".github/workflows/extension-host.yml"

# Runs the extension inside a real VS Code (Electron) host against a real
# nexus-daemon: activation, every contributed command, settings, reconnect and
# the brain-init round trip (vscode-extension/host-test).

jobs:
  host:
    name: VS Code host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # macOS and Linux are required. Windows is a smoke run that has not been
    # proven on a runner yet, so it reports but does not block merges.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Ensure embedded frontend path exists
        shell: bash
        run: |
          mkdir -p build/frontend build/bin
          test -f build/frontend/.gitkeep || touch build/frontend/.gitkeep

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Build the daemon
        shell: bash
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5"
          CGO_LDFLAGS: "-lm"
        run: go build -o build/bin/nexus-daemon-e2e${{ matrix.os == 'windows-latest' && '.exe' || '' }} ./cmd/nexus-daemon

      - name: Install extension dependencies
        working-directory: vscode-extension
        run: npm ci

      - name: Bundle the extension
        working-directory: vscode-extension
        run: npm run build

      - name: Run host tests (Linux, under xvfb)
        if: runner.os == 'Linux'
        working-directory: vscode-extension
        env:
          NEXUS_DAEMON_BIN: ${{ github.workspace }}/build/bin/nexus-daemon-e2e
        run: xvfb-run -a node host-test/run.mjs

      - name: Run host tests
        if: runner.os != 'Linux'
        working-directory: vscode-extension
        shell: bash
        env:
          NEXUS_DAEMON_BIN: ${{ github.workspace }}/build/bin/nexus-daemon-e2e${{ matrix.os == 'windows-latest' && '.exe' || '' }}
        run: node host-test/run.mjs
