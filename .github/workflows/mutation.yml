name: Mutation testing

# Mutation runs are slow (minutes to tens of minutes), so they run weekly and on
# demand instead of on every push. Each job fails below its score gate; the
# gates are ratchets - raise them as the surviving mutants get killed.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (gremlins) ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: internal/core/services
            efficacy: "70"
          - package: internal/core/domain
            efficacy: "70"
          - package: internal/adapters/inbound/httpapi
            efficacy: "60"
    steps:
      - uses: actions/checkout@v6

      - name: Ensure embedded frontend path exists
        run: |
          mkdir -p build/frontend
          test -f build/frontend/.gitkeep || touch build/frontend/.gitkeep

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true
          check-latest: true

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.6.0

      - name: Mutate ${{ matrix.package }}
        env:
          CGO_ENABLED: "1"
          CGO_CFLAGS: "-DSQLITE_ENABLE_FTS5"
          CGO_LDFLAGS: "-lm"
        run: |
          gremlins unleash ./${{ matrix.package }} \
            --workers 2 --timeout-coefficient 4 \
            -E '_test\.go$' \
            --threshold-efficacy ${{ matrix.efficacy }} \
            -o mutation-go.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-go-${{ strategy.job-index }}
          path: mutation-go.json

  typescript:
    name: TypeScript (Stryker) ${{ matrix.dir }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        dir: [github-action, vscode-extension, frontend]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: npm ci

      - name: Mutate
        working-directory: ${{ matrix.dir }}
        run: npm run test:mutation

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.dir }}
          path: ${{ matrix.dir }}/reports/mutation/mutation.json
