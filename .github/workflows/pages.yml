name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        working-directory: docs
        run: npm ci

      - name: Build Vite site (stable)
        if: github.ref_name == 'main'
        working-directory: docs
        env:
          VITE_BASE_PATH: /nexus-orchestrator/
          VITE_DOCS_CHANNEL: stable
          VITE_BETA_URL: /nexus-orchestrator/beta/
        run: npm run build

      - name: Build Vite site (beta)
        if: github.ref_name == 'develop'
        working-directory: docs
        env:
          VITE_BASE_PATH: /nexus-orchestrator/beta/
          VITE_DOCS_CHANNEL: beta
          VITE_STABLE_URL: /nexus-orchestrator/
        run: npm run build

      - name: Deploy stable to gh-pages root
        if: github.ref_name == 'main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/docs
          target-folder: .
          clean: true
          clean-exclude: |
            beta

      - name: Deploy beta to gh-pages /beta subfolder
        if: github.ref_name == 'develop'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: build/docs
          target-folder: beta
          clean: true
