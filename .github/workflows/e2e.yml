name: E2E Tests

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

# Two Playwright projects (frontend/playwright.config.ts):
#   chromium     - structure checks with every /api call mocked; needs only the Vite dev server.
#   real-daemon  - the built nexus-daemon plus a fake Ollama, no mocks: provider discovery,
#                  submit -> execute -> file written, backlog promote, every view, brain search.
# Neither job tolerates failure.

jobs:
  mocked:
    name: Playwright (mocked API)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run mocked specs
        working-directory: frontend
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-mocked
          path: frontend/playwright-report/
          retention-days: 14

  real-daemon:
    name: Playwright (real daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Ensure embedded frontend path exists
        run: |
          mkdir -p build/frontend build/bin
          test -f build/frontend/.gitkeep || touch build/frontend/.gitkeep

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          check-latest: true

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Build the daemon
        run: CGO_ENABLED=1 CGO_CFLAGS="-DSQLITE_ENABLE_FTS5" CGO_LDFLAGS="-lm" go build -o build/bin/nexus-daemon-e2e ./cmd/nexus-daemon

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run real-daemon specs
        working-directory: frontend
        env:
          NEXUS_REAL_DAEMON: "1"
        run: npx playwright test --project=real-daemon

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-real-daemon
          path: frontend/playwright-report/
          retention-days: 14
