name: E2E Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# NOTE: These tests require a running nexus-daemon. In CI they run in smoke-only
# mode against mocked API responses (no real daemon). Tests that require a live
# daemon are skipped via PLAYWRIGHT_SKIP_DAEMON=true / PLAYWRIGHT_CI=true.

jobs:
  e2e:
    name: Playwright E2E (smoke, Chromium)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers (Chromium only)
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      # Requires running daemon — skipped in CI preview; smoke only against mock.
      # Tests check page structure with API calls mocked via Playwright route interception.
      # Tests tagged [slow] or requiring real daemon data are skipped via env flags.
      - name: Run E2E smoke tests
        working-directory: frontend
        env:
          PLAYWRIGHT_CI: 'true'
          PLAYWRIGHT_SKIP_DAEMON: 'true'
          # Frontend dev server must be started externally for real runs.
          # In CI we skip tests requiring a live server; this step validates config only.
        run: npm run test:e2e -- --reporter=html,github

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
