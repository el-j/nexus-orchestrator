name: Release

# Stable releases are made here, by release-please, and only here:
#   1. every push to main updates a "chore(main): release X.Y.Z" pull request that bumps
#      .release-please-manifest.json (the version comes from the conventional commits since the
#      last release: feat → minor, fix → patch, "!" or BREAKING CHANGE → major),
#   2. merging that pull request creates the tag vX.Y.Z and the GitHub release,
#   3. the Publish workflow then builds every artifact and attaches it to that release,
#   4. a pull request merges main back into develop, so betas continue from the new version.
# The version is always a clean X.Y.Z. Betas come from develop (scripts/next-version.sh).
# See docs/releasing.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # The action defaults to the repository's default branch (develop here); releases are made from main.
          target-branch: main
          # Pull requests opened with the default token do not start other workflows (CI does not
          # run on the release PR). Set the secret RELEASE_PLEASE_TOKEN (a PAT with contents and
          # pull-requests write) if you want CI on it; without it the PR still works, it only
          # changes the manifest.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  publish:
    name: Publish ${{ needs.release-please.outputs.tag_name }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  back-merge:
    name: Merge main back into develop
    needs: [release-please, publish]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Open a pull request from main to develop
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "develop already contains main"; exit 0
          fi
          if [ -n "$(gh pr list --base develop --head main --state open --json number -q '.[0].number')" ]; then
            echo "a back-merge pull request is already open"; exit 0
          fi
          gh pr create --base develop --head main \
            --title "chore: merge main back into develop (${{ needs.release-please.outputs.tag_name }})" \
            --body "Release ${{ needs.release-please.outputs.tag_name }} was made from main. This brings its version bump back to develop so betas continue from the new version. develop allows only squash or rebase merges (linear history), so squash this one."
